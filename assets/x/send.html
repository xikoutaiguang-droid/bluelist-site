<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>send</title><p>画像を送っています…</p><script>(async()=>{const names=decodeURIComponent(location.hash.slice(1)).split(",").filter(n=>/^[\w.-]+\.png$/.test(n));const out=[];for(const n of names){const b=await fetch(n).then(r=>r.arrayBuffer());out.push({name:n,buf:b})}if(window.opener){window.opener.postMessage({blueListImages:out},"https://x.com");document.body.textContent="送りました（"+out.length+"枚）"}})();</script>
